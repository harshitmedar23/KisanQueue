{% extends "base.html" %}
{% block title %}Edit Price{% endblock %}
{% block content %}
<div class="narrow-panel">
    <p class="eyebrow">Staff control</p>
    <h1 class="page-title">Edit {{ price.crop_type }} price</h1>
    <p class="text-muted">Update the values used for farmer displays and automatic payment calculations.</p>
    <div class="card">
        <div class="card-body">
            <form method="POST" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Crop</label>
                    <input class="form-control" value="{{ price.crop_type }}" readonly>
                </div>
                <div class="col-12">
                    <label class="form-label">Market name</label>
                    <input name="market_name" class="form-control" value="{{ price.market_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">MSP / quintal</label>
                    <input name="msp_per_quintal" type="number" min="0" step="0.01" class="form-control" value="{{ price.msp_per_quintal }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Market price / quintal</label>
                    <input name="market_price_per_quintal" type="number" min="0" step="0.01" class="form-control" value="{{ price.market_price_per_quintal }}" required>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Save changes</button>
                    <a href="{{ url_for('admin.manage_prices') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
